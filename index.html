<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>take my request?</title>
<style>
  body {
    margin:0; height:100vh;
    display:flex; justify-content:center; align-items:center;
    background:#ffe6ee;
    font-family: monospace;
  }
  .card {
    background:#ffb3d1;
    width:90%; max-width:350px;
    padding:25px 20px 35px;
    border-radius:18px;
    border:4px solid #ff7eb0;
    box-shadow:0 0 25px rgba(255,126,176,0.5);
    text-align:center;
  }
  .img-wrap {
    width:140px; height:140px;
    margin:0 auto 25px;
    border-radius:50%;
    border:4px solid #ff7eb0;
    overflow:hidden; background:white;
  }
  .img-wrap img { width:100%; height:100%; object-fit:cover; }
  h1 {
    color:#c0004a; font-size:26px;
    letter-spacing:3px; margin:15px 0 30px;
  }
  .btns { display:flex; justify-content:center; gap:30px; }
  button {
    border:none; border-radius:8px;
    padding:12px 28px; font-size:18px;
    color:white; cursor:pointer; font-weight:bold;
    transition: all 0.3s ease;
  }
  #yesBtn { background:#4caf50; }
  #noBtn { background:#ff0000; }
</style>
</head>
<body>

<div class="card">
  <div class="img-wrap">
    <img src="me.jpg" alt="photo">
  </div>
  <h1>take my request?</h1>
  <div class="btns">
    <button id="yesBtn">YES</button>
    <button id="noBtn">NO</button>
  </div>
</div>

<script>
  const noBtn = document.getElementById('noBtn');
  const yesBtn = document.getElementById('yesBtn');
  let yesSize = 10;

  function moveNo() {
    // YES ko bara karo
    yesSize += 12;
    yesBtn.style.fontSize = yesSize + 'px';
    yesBtn.style.padding = (12 + yesSize/3) + 'px ' + (28 + yesSize/2) + 'px';

    // NO ko bhagao
    const maxX = window.innerWidth - noBtn.offsetWidth - 20;
    const maxY = window.innerHeight - noBtn.offsetHeight - 20;
    const randomX = Math.random() * maxX;
    const randomY = Math.random() * maxY;

    noBtn.style.position = 'fixed';
    noBtn.style.left = randomX + 'px';
    noBtn.style.top = randomY + 'px';
  }

  noBtn.addEventListener('mouseover', moveNo);
  noBtn.addEventListener('click', moveNo);
  noBtn.addEventListener('touchstart', (e)=>{ e.preventDefault(); moveNo(); });

  yesBtn.addEventListener('click', ()=>{
    document.body.innerHTML = `
      <div style="display:flex;justify-content:center;align-items:center;height:100vh;background:#ffe6ee;flex-direction:column;text-align:center;font-family:monospace;">
        <h1 style="color:#c0004a;font-size:40px;">Yay! ❤️ Accepted!</h1>
        <p style="font-size:20px;">Thank you for saying YES!</p>
      </div>`;
  });
</script>

</body>
</html>
